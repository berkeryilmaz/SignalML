<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SignalML — Python Node-Based Machine Learning Platform{% endblock %}</title>

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="/static/vendor/litegraph.css">
    <!-- SignalML Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/nodes.css">

    <!-- Offline Vendor Libraries (No external CDN required!) -->
    <script src="/static/vendor/jquery.min.js"></script>
    <script src="/static/vendor/litegraph.min.js"></script>
    <script src="/static/vendor/highcharts.js"></script>
    <script src="/static/vendor/papaparse.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand-section">
            <div class="brand-logo">S</div>
            <div class="brand-title">Signal<span>ML</span></div>
        </div>

        <nav class="app-nav">
            <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/projects" class="nav-link {% if active_page == 'projects' %}active{% endif %}">Projects</a>
            <a href="/data-manager" class="nav-link {% if active_page == 'data_manager' %}active{% endif %}">Data Manager</a>
            <a href="/signal-tagger" class="nav-link {% if active_page == 'signal_tagger' %}active{% endif %}">Signal Tagger</a>
            <a href="/signal-processing" class="nav-link {% if active_page == 'signal_processing' %}active{% endif %}">Signal Processing</a>
            <a href="/workflow-builder" class="nav-link {% if active_page == 'workflow_builder' %}active{% endif %}">Visual Workflow</a>
            <a href="/nn-builder" class="nav-link {% if active_page == 'nn_builder' %}active{% endif %}" style="display: inline-flex; align-items: center; gap: 6px;">NN Builder <span style="background: linear-gradient(135deg, #2563eb, #8b5cf6); color: white; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;">🪄 Sihirbaz</span></a>
            <a href="/training" class="nav-link {% if active_page == 'training' %}active{% endif %}">Training</a>
            <a href="/feature-extraction" class="nav-link {% if active_page == 'feature_extraction' %}active{% endif %}">Feature Extraction</a>
            <a href="/clustering" class="nav-link {% if active_page == 'clustering' %}active{% endif %}">Clustering & PCA</a>
            <a href="/model-evaluation" class="nav-link {% if active_page == 'model_evaluation' %}active{% endif %}">Evaluation</a>
            <a href="/exports" class="nav-link {% if active_page == 'exports' %}active{% endif %}">Exports</a>
        </nav>

        <div class="header-actions">
            <div class="project-badge" id="project-switcher-btn" style="cursor: pointer;">
                <span class="status-dot"></span>
                <span id="active-project-name">Loading...</span>
            </div>
            <div class="project-badge" id="health-gpu-pill">
                CPU Mode
            </div>
        </div>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Project Switcher Modal -->
    <div id="project-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); width: 450px; border-radius: 12px; padding: 1.5rem; box-shadow: 0 16px 36px rgba(0,0,0,0.6);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="color: #fff; font-size: 16px;">Workspace Projects</h3>
                <button onclick="document.getElementById('project-modal').style.display='none'" style="background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer;">&times;</button>
            </div>
            <div id="project-modal-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 1rem;">
                <!-- Populated dynamically -->
            </div>
            <hr style="border: none; border-top: 1px solid var(--border-color); margin-bottom: 1rem;">
            <div class="form-group">
                <label class="form-label">Create New Project</label>
                <input type="text" id="new-project-name" class="form-control" placeholder="Project name...">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button onclick="document.getElementById('project-modal').style.display='none'" class="btn btn-secondary btn-sm">Cancel</button>
                <button id="create-project-btn" class="btn btn-primary btn-sm">Create & Switch</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("project-switcher-btn").addEventListener("click", () => {
            const list = document.getElementById("project-modal-list");
            list.innerHTML = "";
            SignalML.projects.forEach(p => {
                const isCur = p.id === SignalML.currentProjectId;
                const div = document.createElement("div");
                div.style.cssText = `padding: 8px 12px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; display: flex; justify-content: space-between; background: ${isCur ? 'rgba(59, 130, 246, 0.2)' : 'rgba(255,255,255,0.03)'}; border: 1px solid ${isCur ? 'var(--accent-blue)' : 'transparent'};`;
                div.innerHTML = `<strong>${p.name}</strong> <span style="font-size: 11px; color: var(--text-muted);">${p.id.slice(0, 8)}</span>`;
                div.onclick = () => {
                    SignalML.switchProject(p.id);
                    document.getElementById("project-modal").style.display = "none";
                };
                list.appendChild(div);
            });
        });

        document.getElementById("create-project-btn").addEventListener("click", () => {
            const input = document.getElementById("new-project-name");
            if (input && input.value.trim()) {
                SignalML.createProject(input.value.trim());
                document.getElementById("project-modal").style.display = "none";
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
